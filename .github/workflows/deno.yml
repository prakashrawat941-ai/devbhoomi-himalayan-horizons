name: Node.js checks

on:
  push:
    branches: ["main", "feature/instant-cab"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin stable npm version
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
